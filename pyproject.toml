[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-advice"
version = "0.1.0"
description = "Personal portfolio rebalancing advisor: weekly advice, daily risk scan, push to Feishu/DingTalk"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.17,<2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ia = "ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
